<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Log in — WhatsApp Marketing</title>
<link rel="stylesheet" href="/styles.css" />
<style>
  .authwrap { max-width: 420px; margin: 8vh auto; padding: 24px; }
  .authwrap h1 { margin-bottom: 4px; }
  .authwrap .subtitle { margin-top: 0; }
  .authwrap label { display: block; margin: 12px 0 4px; }
  .authwrap input[type="email"], .authwrap input[type="password"] { width: 100%; box-sizing: border-box; }
  .authwrap button.primary { width: 100%; margin-top: 16px; }
  .authmsg { min-height: 1.4em; margin-top: 10px; }
</style>
</head>
<body>
<div class="authwrap card">
  <h1>WhatsApp Marketing</h1>
  <p class="subtitle">Log in to your dashboard.</p>
  <form id="loginForm">
    <label>Email<br /><input id="email" type="email" required autocomplete="email" /></label>
    <label>Password<br /><input id="password" type="password" required autocomplete="current-password" /></label>
    <p id="msg" class="authmsg error"></p>
    <button class="primary" type="submit">Log in</button>
  </form>
  <p class="muted">No account yet? <a href="/signup.html">Create one</a>.</p>
</div>
<script>
  document.getElementById("loginForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    const msg = document.getElementById("msg");
    msg.textContent = "";
    try {
      const res = await fetch("/api/auth/login", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          email: document.getElementById("email").value.trim(),
          password: document.getElementById("password").value
        })
      });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(data.error || "Login failed.");
      location.href = "/";
    } catch (err) {
      msg.textContent = err.message;
    }
  });
</script>
</body>
</html>
